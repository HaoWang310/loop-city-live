name: Rebuild Loop City live app

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app/template_combined_v10.html"
      - "html support files/js/**"
      - "html support files/loop/**"
      - "html support files/cell/**"
      - "assets/**"
      - "build/build_app.py"
      - "build/build_cell.py"
      - "build/build_anneal.py"
      - "build/cache_bust.py"
      - ".github/workflows/rebuild-loop-city.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-loop-city
  cancel-in-progress: true

jobs:
  rebuild:
    # Generated/cache-token commits are pushed by this workflow itself.  They may
    # match the broad source paths above, but must not recursively rebuild again.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Rebuild embedded Wool app
        run: python build/build_cell.py

      - name: Rebuild embedded Annealing app
        run: python build/build_anneal.py

      - name: Rebuild combined app
        env:
          LOOP_CITY_NO_ARCHIVE: "1"
        run: python build/build_app.py

      - name: Bust live resource caches
        env:
          LOOP_CITY_CACHE_TOKEN: ${{ github.sha }}
        run: python build/cache_bust.py

      - name: Commit generated live page
        shell: bash
        run: |
          if git diff --quiet -- "index.html" "html support files/loop/index.html" "html support files/cell/cell.html" "html support files/combined_v10.html" "html support files/cell/wool/wool_app.js" "html support files/cell/anneal/anneal_app.js"; then
            echo "Generated pages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "index.html" "html support files/loop/index.html" "html support files/cell/cell.html" "html support files/combined_v10.html" "html support files/cell/wool/wool_app.js" "html support files/cell/anneal/anneal_app.js"
          git commit -m "Auto-rebuild Loop City live pages"
          git push
