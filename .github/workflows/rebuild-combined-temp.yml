name: Rebuild combined quadrant

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python build/build_app.py
      - name: Commit generated quadrant only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "html support files/combined_v10.html"
          if git diff --cached --quiet; then
            echo "No generated change"
          else
            git commit -m "Rebuild combined quadrant UI"
            git push
          fi
