<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop City v10 · the loop</title>
<style>
:root{
  --ink:#231F20; --ink2:#5d5a55; --ink3:#8c8880; --line:#e2ded6; --card:#faf9f7; --paper:#ffffff;
  --brown:#9A4F23; --high:#A46D27; --mid:#DFA94F; --low:#E6D473; --farmH:#C2CDAB; --farmV:#768A5C;
  --com:#B2553F; --inst:#6E7FA0;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);
  font:13px/1.45 "DM Sans","Segoe UI",system-ui,sans-serif}
#app{display:flex;height:100%;min-width:0}
.panel{flex:0 0 272px;height:100%;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.panel.right{border-right:none;border-left:1px solid var(--line);flex-basis:330px}
.panel-splitter{position:relative;flex:0 0 8px;width:8px;height:100%;cursor:col-resize;z-index:20;background:transparent;touch-action:none}
.panel-splitter::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent;transition:background .12s ease}
.panel-splitter:hover::after,.panel-splitter.dragging::after{background:rgba(154,79,35,.45)}
body.panel-resizing{cursor:col-resize!important;user-select:none!important}
body.panel-resizing *{cursor:col-resize!important}
.scroll{overflow-y:auto;padding:12px 16px 22px}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:#dcd8d0;border-radius:5px}
h1{font-size:15px;margin:0 0 2px;font-weight:700}
h1 span{font-weight:400;color:var(--ink3)}
h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:17px 0 8px;font-weight:700}
h2:first-of-type{margin-top:10px}
.head{padding:13px 16px;border-bottom:1px solid var(--line)}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;
  padding:7px 11px;font:inherit;font-size:12px;cursor:pointer}
.btn:hover{border-color:#c9c4bb}
.btn.primary{background:var(--brown);border-color:var(--brown);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 8px;font-size:11px}
.btn.on{background:#efe7dc;border-color:#d9c7b1;color:#6b4a2c;font-weight:600}
.row{display:flex;gap:7px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sl{margin:0 0 11px}
.sl .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-bottom:3px}
.sl .lab b{font-weight:600;color:var(--ink)}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--line);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--brown);cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);margin-top:2px}
.ticks button{border:none;background:none;color:var(--ink3);font:inherit;font-size:10px;cursor:pointer;padding:0}
.ticks button:hover{color:var(--brown)}
.grp{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.grp:first-of-type{border-top:none;margin-top:0}
.grp h3{font-size:12px;margin:0 0 7px;font-weight:700;color:var(--ink)}
.lay{display:flex;align-items:center;gap:8px;margin:0 0 5px}
.lay input[type=checkbox]{margin:0}
.lay .nm{flex:1;font-size:12px}
.lay input[type=range]{width:66px;flex:0 0 66px}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);flex:0 0 12px}
#stage{flex:1 1 auto;min-width:360px;position:relative;background:#fff;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:16px;top:14px;pointer-events:none}
#hud .yr{font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1}
#hud .ph{font-size:11.5px;color:var(--ink3);margin-top:2px}
#bar{position:absolute;left:16px;right:16px;bottom:14px;display:flex;gap:10px;align-items:center;
  background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
#bar input[type=range]{flex:1}
#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.96);
  border:1px solid var(--line);border-radius:9px;padding:13px 18px;font-size:12px;color:var(--ink2)}
.stat{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.stat .k{color:var(--ink2)}
.stat .v{font-weight:600;font-variant-numeric:tabular-nums}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.sub{font-size:11px;color:var(--ink3)}
.kp{display:flex;gap:13px;align-items:flex-start}
#keyplan{width:150px;height:auto;flex:0 0 150px;display:block;margin:2px 0 0 -2px}
#keyplan path[data-zone],#keyplan rect[data-quad],#keyplan circle[data-node]{cursor:pointer}
#keyplan circle[data-node]:hover{stroke:#9A4F23}
.kpside{flex:1;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.kpside .sub{margin-top:4px;line-height:1.45}
.lrow{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.lrow .lnm{flex:1;color:var(--ink2)}
.lrow .lnm i{font-style:normal;color:var(--ink3);font-size:10.5px}
.lrow .lv{font-weight:600;font-variant-numeric:tabular-nums}
.sw.ghost{border-color:transparent;background:none}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:9px 0 0}
.chips .btn{padding:3px 7px;font-size:11px;font-variant-numeric:tabular-nums}
.gpx{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11px;color:var(--ink3)}
.gpx .px{border:1px solid #c9b79c;background:#e9dcc7;flex:none}
.gsum{display:flex;gap:9px;align-items:center;margin:0 0 6px}
.gbox{width:26px;height:26px;flex:0 0 26px;border:1px solid #d8c8b4;background:#F4EEE4;
  background-image:linear-gradient(#e3d6c3 1px,transparent 1px),linear-gradient(90deg,#e3d6c3 1px,transparent 1px);
  background-size:13px 13px}
.gsum b{font-weight:600}
.gsum .sub{display:block}
.lrow .lv2{font-weight:600;font-variant-numeric:tabular-nums;width:58px;text-align:right}
.lrow .lv{min-width:62px;text-align:right}
#grain .lrow .lnm{flex:1}
#grain .sub{margin-top:5px;display:block}
/* Loop City v8: the way down to the next scale. On the map, top right, because the key plan is where you
   choose and the map is where you look -- and the right panel was made to fit a screen without scrolling. */
#jump{position:absolute;right:16px;top:14px;width:258px;background:rgba(255,255,255,.96);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px 12px;box-shadow:0 2px 10px rgba(35,31,32,.06);display:none}
#jump.show{display:block}
#jump .jk{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
#jump .jt{font-size:14px;font-weight:700;margin:3px 0 1px;line-height:1.25}
#jump .js{font-size:11.5px;color:var(--ink2);line-height:1.45}
#jump .btn{width:100%;margin-top:9px;padding:8px 10px;font-size:12.5px;font-weight:600}
#jump .jn{font-size:10.5px;color:var(--ink3);margin-top:6px;line-height:1.4}
#jump.off .jt{color:var(--ink2)}
#jump .lnk{border:none;background:none;padding:0;margin-top:7px;font:inherit;font-size:11.5px;color:var(--brown);cursor:pointer}
#jump .lnk:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="app">

  <!-- ------------------------------------------------------------------ left: the sliders, and Run -->
  <aside class="panel" id="leftPanel">
    <div class="head">
      <div class="row">
        <button class="btn primary" id="btnRun">运行</button>
        <button class="btn small on" data-scope="loop">整个环线</button>
        <button class="btn small" data-scope="quad">象限</button>
      </div>
      <div class="sub" id="runNote" style="margin-top:7px">整个环线 · 70 m 网格</div>
    </div>
    <div class="scroll">
      <h2>参数目录</h2>
      <div id="sliders"></div>
    </div>
  </aside>
  <div class="panel-splitter" id="leftSplitter" role="separator" aria-orientation="vertical" aria-label="调整左侧控制栏宽度" title="拖动调整左侧控制栏宽度；双击恢复默认"></div>

  <!-- ------------------------------------------------------------------ middle: the map -->
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"><div class="yr" id="hudYear">2025</div><div class="ph" id="hudPhase">ready</div></div>
    <div id="bar">
      <button class="btn small" id="btnPlay">▶</button>
      <input type="range" id="yslider" min="2025" max="2100" step="1" value="2025">
      <span class="row" id="speeds">
        <button class="btn small" data-speed="180">&frac12;&times;</button>
        <button class="btn small on" data-speed="90">1&times;</button>
        <button class="btn small" data-speed="45">2&times;</button>
      </span>
      <span class="sub" id="barNote">run the model to see the years</span>
    </div>
    <div id="status">loading the ground…</div>
    <div id="jump"></div>
  </main>
  <div class="panel-splitter" id="rightSplitter" role="separator" aria-orientation="vertical" aria-label="调整右侧控制栏宽度" title="拖动调整右侧控制栏宽度；双击恢复默认"></div>

  <!-- ------------------------------------------------------------------ right: year, population, key plan, legends -->
  <aside class="panel right" id="rightPanel">
    <div class="head">
      <div class="row" style="align-items:flex-start">
        <div style="flex:1">
          <div class="sub" id="popWhat">Population, the whole loop</div>
          <div class="big" id="pop">0</div>
          <div class="sub" id="popOf">of 3.39 M new people by 2100</div>
        </div>
        <div style="text-align:right">
          <div class="sub" style="margin-bottom:4px">Export PNG</div>
          <div class="row" style="justify-content:flex-end">
            <button class="btn small" id="btnPngFrame" title="the map alone, with its year">Frame</button>
            <button class="btn small" id="btnPngSheet" title="the map with a strip of figures under it">Sheet</button>
          </div>
        </div>
      </div>
    </div>
    <div class="scroll">
      <h2>Key plan</h2>
      <div class="kp">
        <svg id="keyplan" viewBox="0 0 160 160"></svg>
        <div class="kpside">
          <button class="btn small" data-view="loop">Full loop</button>
          <button class="btn small" data-view="quadrant">Quadrant</button>
          <button class="btn small" data-view="zone">Zone</button>
          <button class="btn small" data-view="node">Node</button>
          <div class="sub" id="viewNote">the whole loop</div>
        </div>
      </div>
      <div class="chips" id="nodeChips"></div>

      <h2>Land</h2>
      <div id="stats"></div>

      <h2>Layers</h2>
      <div id="layers"></div>

      <h2>One grain</h2>
      <div id="grain"></div>
    </div>
  </aside>
</div>

<script src="../js/lclink.js"></script>
<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  "use strict";

  var left = document.getElementById("leftPanel");
  var right = document.getElementById("rightPanel");
  var leftHandle = document.getElementById("leftSplitter");
  var rightHandle = document.getElementById("rightSplitter");
  if (!left || !right || !leftHandle || !rightHandle) return;

  var DEFAULT_LEFT = 272;
  var DEFAULT_RIGHT = 330;
  var MIN_LEFT = 210;
  var MIN_RIGHT = 240;
  var MIN_STAGE = 360;
  var HANDLE_TOTAL = 16;

  function num(v, fallback) {
    v = parseFloat(v);
    return isFinite(v) ? v : fallback;
  }

  function currentLeft() {
    return num(getComputedStyle(left).flexBasis, left.getBoundingClientRect().width || DEFAULT_LEFT);
  }

  function currentRight() {
    return num(getComputedStyle(right).flexBasis, right.getBoundingClientRect().width || DEFAULT_RIGHT);
  }

  function maxLeft() {
    return Math.max(MIN_LEFT, window.innerWidth - currentRight() - MIN_STAGE - HANDLE_TOTAL);
  }

  function maxRight() {
    return Math.max(MIN_RIGHT, window.innerWidth - currentLeft() - MIN_STAGE - HANDLE_TOTAL);
  }

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function apply(which, width, persist) {
    if (which === "left") {
      width = clamp(width, MIN_LEFT, maxLeft());
      left.style.flexBasis = Math.round(width) + "px";
      if (persist) localStorage.setItem("loopCity.leftPanelWidth", String(Math.round(width)));
    } else {
      width = clamp(width, MIN_RIGHT, maxRight());
      right.style.flexBasis = Math.round(width) + "px";
      if (persist) localStorage.setItem("loopCity.rightPanelWidth", String(Math.round(width)));
    }
    // The map canvas is fitted on the application's resize listener.
    window.dispatchEvent(new Event("resize"));
  }

  function begin(handle, which, ev) {
    ev.preventDefault();
    handle.setPointerCapture(ev.pointerId);
    handle.classList.add("dragging");
    document.body.classList.add("panel-resizing");

    var startX = ev.clientX;
    var startWidth = which === "left" ? left.getBoundingClientRect().width : right.getBoundingClientRect().width;

    function move(e) {
      var dx = e.clientX - startX;
      apply(which, which === "left" ? startWidth + dx : startWidth - dx, false);
    }

    function end(e) {
      try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", end);
      handle.removeEventListener("pointercancel", end);
      handle.classList.remove("dragging");
      document.body.classList.remove("panel-resizing");
      var width = which === "left" ? left.getBoundingClientRect().width : right.getBoundingClientRect().width;
      apply(which, width, true);
    }

    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
  }

  leftHandle.addEventListener("pointerdown", function (e) { begin(leftHandle, "left", e); });
  rightHandle.addEventListener("pointerdown", function (e) { begin(rightHandle, "right", e); });

  leftHandle.addEventListener("dblclick", function () {
    left.style.flexBasis = DEFAULT_LEFT + "px";
    localStorage.removeItem("loopCity.leftPanelWidth");
    window.dispatchEvent(new Event("resize"));
  });
  rightHandle.addEventListener("dblclick", function () {
    right.style.flexBasis = DEFAULT_RIGHT + "px";
    localStorage.removeItem("loopCity.rightPanelWidth");
    window.dispatchEvent(new Event("resize"));
  });

  var savedLeft = num(localStorage.getItem("loopCity.leftPanelWidth"), DEFAULT_LEFT);
  var savedRight = num(localStorage.getItem("loopCity.rightPanelWidth"), DEFAULT_RIGHT);
  left.style.flexBasis = clamp(savedLeft, MIN_LEFT, Math.max(MIN_LEFT, window.innerWidth - MIN_RIGHT - MIN_STAGE - HANDLE_TOTAL)) + "px";
  right.style.flexBasis = clamp(savedRight, MIN_RIGHT, Math.max(MIN_RIGHT, window.innerWidth - left.getBoundingClientRect().width - MIN_STAGE - HANDLE_TOTAL)) + "px";

  window.addEventListener("resize", function () {
    var lw = left.getBoundingClientRect().width;
    var rw = right.getBoundingClientRect().width;
    var available = window.innerWidth - HANDLE_TOTAL - MIN_STAGE;
    if (lw + rw > available) {
      var overflow = lw + rw - available;
      if (rw - overflow >= MIN_RIGHT) right.style.flexBasis = Math.round(rw - overflow) + "px";
      else left.style.flexBasis = Math.max(MIN_LEFT, Math.round(available - MIN_RIGHT)) + "px";
    }
  });
})();
</script>
</body>
</html>
